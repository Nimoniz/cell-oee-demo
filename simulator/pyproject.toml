[project]
name = "cell-sim"
version = "0.1.0"
description = "Simulated robotic welding + assembly cell exposing its data over OPC UA"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=1.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cell-sim = "cell_sim.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cell_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-week simulations (~30 s), deselect with -m \"not slow\""]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
