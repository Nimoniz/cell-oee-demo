[project]
name = "cell-oee-backend"
version = "0.1.0"
description = "OEE core, OPC UA collector and API for the cell OEE demo"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncua>=1.1",
    "fastapi>=0.110",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "hypothesis>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs Docker (TimescaleDB via testcontainers), or TEST_DATABASE_URL",
    "e2e: simulator -> collector -> database, several minutes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**" = ["E501"]
"tests/**" = ["E501"]
# FastAPI's own idiom: Depends(...)/Query(...) as argument defaults, resolved per request.
"app/api/**" = ["B008"]
